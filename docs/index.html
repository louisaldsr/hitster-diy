<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="robots" content="noindex">
<title>Hitster DIY</title>
<style>
  :root {
    --bg: #111111;
    --fg: #f2efe8;
    --muted: #8a867e;
    --accent: #e8b44a;
    --disc: #1c1c1c;
    --groove: #262626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    text-align: center;
    user-select: none;
  }
  .num {
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-bottom: 28px;
    min-height: 1em;
  }
  .disc {
    position: relative;
    width: min(72vw, 300px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: none;
    padding: 0;
    cursor: pointer;
    background:
      radial-gradient(circle, var(--accent) 0 17%, var(--bg) 17% 19%, transparent 19%),
      repeating-radial-gradient(circle, var(--disc) 0 3px, var(--groove) 3px 4px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    transition: transform 0.15s;
  }
  .disc:active { transform: scale(0.97); }
  .disc.spin { animation: spin 3.2s linear infinite; }
  .disc:disabled { cursor: default; opacity: 0.5; }
  @keyframes spin { to { rotate: 360deg; } }
  .icon {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
  }
  .icon svg { width: 13%; height: 13%; fill: var(--bg); }
  .status {
    margin-top: 28px;
    font-size: 15px;
    color: var(--muted);
    min-height: 1.4em;
    max-width: 320px;
  }
  .status.error { color: #e57b6b; }
  .controls {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    visibility: hidden;
  }
  .controls.on { visibility: visible; }
  .controls button {
    background: transparent;
    color: var(--fg);
    border: 1px solid #333;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  .controls button:active { background: #222; }
  .bar {
    width: min(72vw, 300px);
    height: 3px;
    background: #2a2a2a;
    border-radius: 2px;
    margin-top: 20px;
    overflow: hidden;
    visibility: hidden;
  }
  .bar.on { visibility: visible; }
  .bar div { height: 100%; width: 0; background: var(--accent); transition: width 0.25s linear; }
  .home h1 { font-size: 22px; font-weight: 600; margin: 0 0 12px; }
  .home p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 auto; max-width: 300px; }
  /* Le lecteur YouTube existe mais reste invisible : rien ne dévoile le morceau. */
  #player-wrap {
    position: fixed;
    width: 200px;
    height: 200px;
    left: 0;
    bottom: 0;
    opacity: 0;
    pointer-events: none;
    z-index: -1;
  }
</style>
</head>
<body>
  <main id="game" hidden>
    <button class="disc" id="disc" aria-label="Lecture" disabled>
      <span class="icon" id="icon"></span>
    </button>
    <div class="bar" id="bar"><div id="progress"></div></div>
    <div class="status" id="status">Chargement…</div>
    <div class="controls" id="controls">
      <button id="restart">Reprendre au début</button>
      <button id="fwd">+10 s</button>
    </div>
  </main>

  <main id="home" class="home" hidden>
    <h1>Hitster DIY</h1>
    <p>Scanne le QR code d'une carte avec l'appareil photo du téléphone pour écouter le morceau.</p>
  </main>

  <div id="player-wrap"><div id="player"></div></div>

<script>
  const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';

  const $ = (id) => document.getElementById(id);
  const code = (new URLSearchParams(location.search).get("c") || "").trim().toUpperCase();

  let player = null;
  let card = null;
  let ready = false;
  let playing = false;
  let tick = null;

  function setStatus(text, isError = false) {
    $("status").textContent = text;
    $("status").classList.toggle("error", isError);
  }

  function setPlaying(on) {
    playing = on;
    $("icon").innerHTML = on ? ICON_PAUSE : ICON_PLAY;
    $("disc").classList.toggle("spin", on);
    $("disc").setAttribute("aria-label", on ? "Pause" : "Lecture");
  }

  function startTick() {
    clearInterval(tick);
    tick = setInterval(() => {
      if (!player || !player.getDuration) return;
      const d = player.getDuration();
      const t = player.getCurrentTime();
      if (d > 0) $("progress").style.width = Math.min(100, (t / d) * 100) + "%";
    }, 250);
  }

  async function init() {
    if (!code) {
      $("home").hidden = false;
      return;
    }
    $("game").hidden = false;
    $("icon").innerHTML = ICON_PLAY;

    try {
      const res = await fetch("cartes.json?v=" + Date.now());
      const cartes = await res.json();
      card = cartes[code];
    } catch (e) {
      setStatus("Impossible de charger la liste des cartes.", true);
      return;
    }
    if (!card) {
      setStatus("Carte inconnue ou pas encore prête.", true);
      return;
    }

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player("player", {
      width: 200,
      height: 200,
      videoId: card.v,
      playerVars: { start: card.s || 0, playsinline: 1, controls: 0, disablekb: 1, rel: 0 },
      events: {
        onReady: () => {
          ready = true;
          $("disc").disabled = false;
          setStatus("Appuie sur le disque");
        },
        onStateChange: (e) => {
          const S = YT.PlayerState;
          if (e.data === S.PLAYING) {
            setPlaying(true);
            setStatus("");
            $("controls").classList.add("on");
            $("bar").classList.add("on");
            startTick();
          } else if (e.data === S.BUFFERING) {
            setStatus("Chargement…");
          } else if (e.data === S.PAUSED) {
            setPlaying(false);
            setStatus("En pause");
          } else if (e.data === S.ENDED) {
            setPlaying(false);
            setStatus("Terminé");
          }
        },
        onError: (e) => {
          setPlaying(false);
          $("disc").disabled = true;
          const msg = e.data === 101 || e.data === 150
            ? "Cette vidéo ne peut pas être lue ici. Change son ID dans le CSV."
            : "Vidéo introuvable ou supprimée. Change son ID dans le CSV.";
          setStatus(msg + " (carte " + code + ")", true);
        },
      },
    });
  };

  $("disc").addEventListener("click", () => {
    if (!ready) return;
    if (playing) player.pauseVideo();
    else player.playVideo();
  });
  $("restart").addEventListener("click", () => {
    if (!ready) return;
    player.seekTo(card.s || 0, true);
    player.playVideo();
  });
  $("fwd").addEventListener("click", () => {
    if (!ready) return;
    player.seekTo(player.getCurrentTime() + 10, true);
  });

  init();
</script>
</body>
</html>
